name: Add network and Microsoft stack

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add VPC VLAN and Microsoft 365
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('DNS, TLS/HTTPS, SSH e segurança de rede', 'VPC, VLAN, DNS, TLS/HTTPS, SSH e segurança de rede'),
              ('<span>IBM Cloud</span><span>Linux</span>', '<span>IBM Cloud</span><span>VPC</span><span>VLAN</span><span>Linux</span>'),
              ('<span>Google Workspace Security</span>', '<span>Google Workspace Security</span><span>Microsoft 365 Security</span>'),
              ('<span>Google Workspace</span><span>Runbooks</span>', '<span>Google Workspace</span><span>Microsoft 365</span><span>Runbooks</span>')
          ]
          changed = False
          for old, new in replacements:
              if old in s and new not in s:
                  s = s.replace(old, new, 1)
                  changed = True
          if not changed:
              raise SystemExit('No matching portfolio text found')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add VPC VLAN and Microsoft 365 to portfolio"
          git push
