name: Complete AWS cloud stack

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add AWS services to cloud stack card
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<div class="card stack-group reveal"><h3>Cloud, Datacenter & Virtualization</h3><div class="stack"><span>AWS</span><span>Amazon VPC</span><span>Amazon EC2</span><span>Amazon S3</span><span>Linode</span><span>IBM Cloud</span><span>VMware vCenter</span><span>VMware</span><span>Hyper-V</span></div></div>'
          new = '<div class="card stack-group reveal"><h3>Cloud, Datacenter & Virtualization</h3><div class="stack"><span>AWS</span><span>Amazon VPC</span><span>Amazon EC2</span><span>Amazon S3</span><span>Amazon ECR</span><span>Route 53</span><span>Amazon OpenSearch Service</span><span>Linode</span><span>IBM Cloud</span><span>VMware vCenter</span><span>VMware</span><span>Hyper-V</span></div></div>'
          if old not in s:
              raise SystemExit('Cloud stack card not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Complete AWS cloud stack card"
          git push
