name: Refine pillars description

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine four pillars description
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'Uma forma simples de explicar meu trabalho sem reduzir meu perfil a um único rótulo.'
          new = 'Uma visão clara da minha atuação em Segurança, Infraestrutura, Cloud e DevSecOps.'
          if old not in s:
              raise SystemExit('Pillars description not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine four pillars description"
          git push
