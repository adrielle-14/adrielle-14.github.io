name: Update PCI DSS case

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update PCI DSS case content
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''<article class="card case-card reveal"><div class="case-kicker">GRC • PCI DSS</div><h3>Certificação PCI DSS 3.2 e transição para 4.0</h3><p>Atuação direta na renovação da certificação e na evolução dos controles técnicos e documentais exigidos pela nova versão.</p><ul><li>Responsabilidade compartilhada com provedores</li><li>Hardening e menor privilégio</li><li>Varreduras, retestes e disputa técnica de achados</li><li>Evidências, conscientização e trilha de auditoria</li></ul><div class="case-result"><strong>Resultado:</strong> certificação renovada com controles e evidências adequados à nova versão do padrão.</div><div class="tags"><span class="tag">PCI DSS 3.2</span><span class="tag">PCI DSS 4.0</span><span class="tag">Audit</span><span class="tag">Hardening</span></div></article>'''
          new = '''<article class="card case-card reveal"><div class="case-kicker">GRC • PCI DSS</div><h3>Certificação PCI DSS 3.2 e transição para 4.0</h3><p>Responsável pela condução do PCI DSS, incluindo renovação da certificação, transição da versão 3.2 para 4.0, adequação do ambiente, criação de evidências e documentação, revisão de controles técnicos e acompanhamento das exigências do padrão.</p><ul><li>Adequação do ambiente aos requisitos do PCI DSS 4.0</li><li>Criação e organização de evidências e documentação de auditoria</li><li>Hardening, menor privilégio e revisão de controles técnicos</li><li>Acompanhamento de pentests independentes exigidos pelo PCI DSS</li><li>Análise, priorização, correção e reteste dos achados identificados</li><li>Acompanhamento de planos de ação e auditoria</li></ul><div class="case-result"><strong>Resultado:</strong> certificação renovada, ambiente adequado aos novos requisitos e processo de evidências e controles estruturado para auditoria.</div><div class="tags"><span class="tag">PCI DSS 3.2</span><span class="tag">PCI DSS 4.0</span><span class="tag">Audit</span><span class="tag">Hardening</span></div></article>'''
          if old not in s:
              raise SystemExit('PCI DSS block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Strengthen PCI DSS case ownership"
          git push
