name: Refine professional contact text

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update contact text
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<p>Tenho interesse em oportunidades que valorizem um perfil híbrido e prático, especialmente Cyber Security, SecOps, Blue Team, Security Engineering, Cloud Security, DevSecOps e Platform Security em ambientes críticos ou regulados.</p>'
          new = '<p>Atuo em contextos que valorizam um perfil híbrido e prático, conectando Cyber Security, SecOps, Blue Team, Security Engineering, Cloud Security, DevSecOps e Platform Security em ambientes críticos ou regulados.</p>'
          if old not in s:
              raise SystemExit(0)
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make professional contact text timeless"
          git push
