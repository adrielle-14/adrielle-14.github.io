name: Add pfSense to portfolio

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add pfSense references
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('HAProxy, nginx, Fortigate e balanceamento','HAProxy, nginx, Fortigate, pfSense e balanceamento',1)
          s = s.replace('<span>Fortigate</span><span>Tenable</span>','<span>Fortigate</span><span>pfSense</span><span>Tenable</span>',1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add pfSense to network security stack"
          git push
