name: Update PCI DSS summary

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update PCI DSS summary metric
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<div class="card"><div class="metric">3.2 → 4.0</div><div class="metric-label">atuação na renovação e transição do PCI DSS entre versões</div></div>'
          new = '<div class="card"><div class="metric">3.2 → 4.0</div><div class="metric-label">condução da renovação, adequação e transição do PCI DSS</div></div>'
          if old not in s:
              raise SystemExit('PCI DSS metric not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Strengthen PCI DSS summary"
          git push
