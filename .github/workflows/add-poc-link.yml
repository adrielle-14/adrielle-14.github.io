name: Add AWS services to portfolio

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Amazon ECR Route 53 and OpenSearch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('<span>AWS</span><span>Linode</span>', '<span>AWS</span><span>Amazon ECR</span><span>Route 53</span><span>Amazon OpenSearch Service</span><span>Linode</span>'),
              ('AWS, Linode, IBM Cloud e ambientes híbridos', 'AWS, Amazon ECR, Route 53, Amazon OpenSearch Service, Linode, IBM Cloud e ambientes híbridos')
          ]
          changed = False
          for old, new in replacements:
              if old in s and new not in s:
                  s = s.replace(old, new, 1)
                  changed = True
          if not changed:
              raise SystemExit('No AWS stack text matched')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add AWS platform services to portfolio"
          git push
