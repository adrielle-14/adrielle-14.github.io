name: Add PoC link

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add link to AppSec case
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'security-poc-template' in s:
              raise SystemExit(0)
          target = '<div class="case-result"><strong>Resultado:</strong> 18 achados confirmados, com hipóteses testadas e evidências técnicas para priorização das correções.</div>'
          button = target + '<div class="hero-actions" style="margin-top:18px"><a class="btn" href="https://github.com/adrielle-14/security-poc-template" target="_blank" rel="noreferrer">Ver PoC anonimizada no GitHub</a></div>'
          if target not in s:
              raise SystemExit('Trecho do case AppSec não encontrado')
          p.write_text(s.replace(target, button, 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add anonymized AppSec PoC link"
          git push
