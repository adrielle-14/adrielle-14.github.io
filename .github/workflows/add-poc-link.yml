name: Simplify application stack

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simplify application and integration stack
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<div class="card stack-group reveal"><h3>Application & Integration</h3><div class="stack"><span>Python</span><span>FastAPI</span><span>Celery</span><span>Tornado</span><span>React</span><span>Node.js</span><span>npm</span><span>REST APIs</span><span>Webhooks</span></div></div>'
          new = '<div class="card stack-group reveal"><h3>Application & Integration</h3><div class="stack"><span>Python</span><span>Bash</span><span>Shell</span><span>REST APIs</span></div></div>'
          if old not in s:
              raise SystemExit('Application stack block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Simplify application integration stack"
          git push
