name: Refine stack note

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simplify stack note
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<div class="callout reveal" style="margin-top:18px"><strong>Como apresento meu domínio:</strong> destaco como core expertise as tecnologias que implementei, operei e usei em incidentes; separo das ferramentas em que tenho atuação prática/intermediária ou contato pontual. Isso mantém o portfólio tecnicamente honesto e evita transformar a stack em uma lista inflada de buzzwords.</div>'
          new = '<p class="stack-note reveal" style="margin-top:18px"><strong style="color:var(--accent)">Stack baseada em experiência prática:</strong> construída a partir de ambientes reais de Segurança, Infraestrutura, Cloud e DevSecOps.</p>'
          if old not in s:
              raise SystemExit(0)
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Simplify stack experience note"
          git push
